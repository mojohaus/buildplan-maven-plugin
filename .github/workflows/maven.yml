name: GitHub CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Verify
    uses: apache/maven-gh-actions-shared/.github/workflows/maven-verify.yml@v5
    with:
      # Temurin comes from the runners' tool cache; Zulu is downloaded on every job
      jdk-distribution-matrix: '[ "temurin" ]'
      ff-jdk-distribution: 'temurin'
      maven4-enabled: true
      matrix-exclude: >
        [
          {"os": "macos-latest", "jdk": "8"},
          {"os": "macos-latest", "jdk": "21"},
          {"os": "windows-latest", "jdk": "21"}
        ]
